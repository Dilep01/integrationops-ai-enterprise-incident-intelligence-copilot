[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "integrationops-ai"
version = "0.10.0"
description = "Evidence-grounded incident intelligence for enterprise integrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
rag = [
  "sentence-transformers>=3,<6",
]

[project.scripts]
integrationops-api = "integrationops.api:run"
integrationops-evaluate = "integrationops.evaluation:run"
integration-runtime = "integration_runtime.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/integrationops", "src/integration_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
