<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">IntegrationOps AI architecture</title>
  <desc id="desc">Controlled investigation graph, hybrid RAG, operational tools, safety gates, persistence, and approval-gated remediation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4e8d75"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
    <style>
      .box{fill:#0c1815;stroke:#27483d;stroke-width:1.5}.accent{fill:#10271f;stroke:#4ee2a1;stroke-width:1.8}
      .warn{fill:#211b11;stroke:#ffbf69;stroke-width:1.5}.muted{fill:#091411;stroke:#1d342c;stroke-width:1.2}
      .h{font:700 24px 'Segoe UI',Arial;fill:#dcebe5}.t{font:600 16px 'Segoe UI',Arial;fill:#c4d7cf}
      .s{font:13px 'Segoe UI',Arial;fill:#829b91}.m{font:12px Consolas,monospace;fill:#79b89d}
      .a{stroke:#4e8d75;stroke-width:2;fill:none;marker-end:url(#arrow)}.d{stroke:#365d4e;stroke-width:1.5;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#07110f"/><circle cx="1380" cy="80" r="270" fill="#164b39" opacity=".17"/>
  <text x="70" y="62" class="h" font-size="28">IntegrationOps AI — controlled incident intelligence architecture</text>
  <text x="70" y="88" class="s">Evidence enters through authorized retrieval and read-only tools. State changes use a separate human-approved path.</text>

  <rect x="70" y="130" width="190" height="88" rx="14" class="accent" filter="url(#shadow)"/>
  <text x="165" y="166" text-anchor="middle" class="t">React console</text><text x="165" y="191" text-anchor="middle" class="m">incident + identity</text><path d="M260 174H338" class="a"/>
  <rect x="338" y="130" width="210" height="88" rx="14" class="box"/>
  <text x="443" y="166" text-anchor="middle" class="t">FastAPI boundary</text><text x="443" y="191" text-anchor="middle" class="m">tenant · role · validation</text><path d="M548 174H626" class="a"/>
  <rect x="626" y="117" width="555" height="114" rx="17" class="accent" filter="url(#shadow)"/>
  <text x="903" y="155" text-anchor="middle" class="t">LangGraph investigation workflow</text>
  <g transform="translate(650 178)"><text x="0" y="0" class="m">NORMALIZE</text><text x="116" y="0" class="s">→</text><text x="144" y="0" class="m">ROUTE</text><text x="224" y="0" class="s">→</text><text x="252" y="0" class="m">DIAGNOSE</text><text x="348" y="0" class="s">→</text><text x="376" y="0" class="m">VALIDATE</text></g>
  <text x="903" y="210" text-anchor="middle" class="s">typed graph state · bounded tool routing · durable checkpoints</text><path d="M1181 174H1260" class="a"/>
  <rect x="1260" y="130" width="270" height="88" rx="14" class="accent"/>
  <text x="1395" y="165" text-anchor="middle" class="t">Incident report</text><text x="1395" y="190" text-anchor="middle" class="m">hypotheses · evidence · actions</text>
  <path d="M790 231V304" class="a"/><path d="M1015 231V304" class="a"/>

  <rect x="70" y="304" width="850" height="388" rx="18" class="box"/>
  <text x="100" y="344" class="t">Hybrid RAG path</text><text x="100" y="368" class="s">Authorization filters are applied before text reaches reranking or generation.</text>
  <rect x="100" y="404" width="190" height="86" rx="12" class="muted"/>
  <text x="195" y="437" text-anchor="middle" class="t">Versioned knowledge</text><text x="195" y="463" text-anchor="middle" class="m">runbooks · guides · catalog</text><path d="M290 447H346" class="a"/>
  <rect x="346" y="404" width="190" height="86" rx="12" class="muted"/>
  <text x="441" y="437" text-anchor="middle" class="t">Section chunking</text><text x="441" y="463" text-anchor="middle" class="m">metadata + ACL labels</text><path d="M536 447H592" class="a"/>
  <rect x="592" y="390" width="294" height="114" rx="12" class="accent"/>
  <text x="739" y="425" text-anchor="middle" class="t">Qdrant candidate search</text><text x="739" y="452" text-anchor="middle" class="m">dense + sparse + RRF</text><text x="739" y="478" text-anchor="middle" class="s">tenant · environment · role filter</text>
  <path d="M739 504V556" class="a"/>
  <rect x="592" y="556" width="294" height="106" rx="12" class="accent"/>
  <text x="739" y="591" text-anchor="middle" class="t">Cross-encoder reranker</text><text x="739" y="618" text-anchor="middle" class="m">dedupe · diversity · top-k</text><text x="739" y="643" text-anchor="middle" class="s">evidence chunks with provenance</text>
  <path d="M592 610H522" class="d"/>
  <rect x="100" y="556" width="422" height="106" rx="12" class="muted"/>
  <text x="311" y="590" text-anchor="middle" class="t">Local retrieval models</text><text x="311" y="618" text-anchor="middle" class="m">all-MiniLM-L6-v2 · ms-marco-MiniLM-L-6-v2</text><text x="311" y="643" text-anchor="middle" class="s">deterministic baseline remains available for tests</text>

  <rect x="954" y="304" width="576" height="388" rx="18" class="box"/>
  <text x="984" y="344" class="t">Read-only operational agent tools</text><text x="984" y="368" class="s">Incident-specific routing gathers facts without mutating target systems.</text>
  <rect x="984" y="404" width="240" height="84" rx="12" class="muted"/><text x="1104" y="438" text-anchor="middle" class="t">Logs</text><text x="1104" y="463" text-anchor="middle" class="m">errors · counts · timing</text>
  <rect x="1260" y="404" width="240" height="84" rx="12" class="muted"/><text x="1380" y="438" text-anchor="middle" class="t">Configuration</text><text x="1380" y="463" text-anchor="middle" class="m">changes · versions</text>
  <rect x="984" y="520" width="240" height="84" rx="12" class="muted"/><text x="1104" y="554" text-anchor="middle" class="t">Service status</text><text x="1104" y="579" text-anchor="middle" class="m">health · reachability</text>
  <rect x="1260" y="520" width="240" height="84" rx="12" class="muted"/><text x="1380" y="554" text-anchor="middle" class="t">Incident history</text><text x="1380" y="579" text-anchor="middle" class="m">resolved causes</text>
  <rect x="984" y="628" width="516" height="42" rx="10" class="muted"/><text x="1242" y="654" text-anchor="middle" class="m">synthetic adapters behind typed tool interfaces</text>

  <path d="M739 692V754" class="a"/><path d="M1242 692V754" class="a"/>
  <rect x="470" y="754" width="660" height="104" rx="16" class="accent" filter="url(#shadow)"/>
  <text x="800" y="789" text-anchor="middle" class="t">Grounding and policy gates</text><text x="800" y="816" text-anchor="middle" class="m">schema · evidence IDs · sufficiency · confidence · secret redaction</text><text x="800" y="840" text-anchor="middle" class="s">malformed, invented, or unsupported output fails closed</text>
  <path d="M1130 806H1200" class="a"/>
  <rect x="1200" y="754" width="330" height="104" rx="16" class="box"/>
  <text x="1365" y="789" text-anchor="middle" class="t">Persistence &amp; observability</text><text x="1365" y="816" text-anchor="middle" class="m">SQLite/Postgres · audit · OTel</text><text x="1365" y="840" text-anchor="middle" class="s">reports · checkpoints · metrics</text>
  <path d="M800 858V912" class="a"/>
  <rect x="70" y="902" width="1060" height="64" rx="14" class="box"/>
  <text x="100" y="930" class="t">Evaluation loop</text><text x="100" y="952" class="s">retrieval metrics · diagnosis fixtures · citation checks · ACL tests · latency/token/cost fields · CI thresholds</text>
  <rect x="1165" y="890" width="365" height="82" rx="14" class="warn"/>
  <text x="1347" y="921" text-anchor="middle" class="t">Separate remediation path</text><text x="1347" y="946" text-anchor="middle" class="m">request → approve → execute → audit</text>
  <path d="M1395 218V890" class="d"/><text x="1512" y="880" text-anchor="end" class="s">local simulator only</text>
</svg>
