name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest --cov=integrationops --cov=integration_runtime --cov-fail-under=90
      - name: Enforce offline evaluation thresholds
        run: python -m integrationops.evaluation --enforce
      - name: Validate migrations
        env:
          INTEGRATIONOPS_DATABASE_URL: sqlite:///./.data/ci.db
        run: |
          mkdir -p .data
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Validate Docker Compose
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
